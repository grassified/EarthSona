name: Feature request
description: Suggest one improvement to EarthSona.
body:
  - type: markdown
    attributes:
      value: |
        This form creates a public issue. For security concerns, see [SECURITY.md](https://github.com/grassified/EarthSona/blob/main/SECURITY.md).
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow and problem
      description: Describe what you are trying to do and the steps that show the gap.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen and how a reviewer could verify it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include a workaround, public reference, or example if relevant.
